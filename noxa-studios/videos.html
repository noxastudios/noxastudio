<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noxa Studios - Videolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="galaxy"></canvas>
  <header id="nav"></header>

  <main>
    <h2>Videolar</h2>
    <p class="sub">Projelerimizden videolar. Aradığını bulmak için aşağıdaki arama kutusunu kullan.</p>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Video ara (başlık, açıklama, etiket)...">
      <button class="btn plus" id="addBtn" title="Video ekle" style="display:none">+</button>
    </div>
    <p class="hint" id="hint"></p>

    <div class="grid" id="grid"></div>
  </main>

  <footer>© <span id="year"></span> Noxa Studios</footer>

  <script src="js/common.js"></script>
  <script>
    let videos = DB.get("videos", []);

    // YouTube linkinden video ID'si çıkarır
    function getYouTubeId(url) {
      const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const list = videos
        .map((v, i) => ({ ...v, _i: i }))
        .filter(v => !q || [v.title, v.desc, v.tags].join(" ").toLowerCase().includes(q));

      document.getElementById("grid").innerHTML = list.length
        ? list.map(v => {
            const id = getYouTubeId(v.url || "");
            const media = id
              ? `<iframe class="video-frame" src="https://www.youtube.com/embed/${id}" title="${escapeHtml(v.title)}" allowfullscreen loading="lazy"></iframe>`
              : `<a class="video-link" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">▶ Videoyu aç</a>`;
            const tags = (v.tags || "").split(",").map(t => t.trim()).filter(Boolean)
              .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
            return `
              <div class="card">
                ${Auth.isOwner ? `<button class="del" data-i="${v._i}" title="Sil">×</button>` : ""}
                ${media}
                <h3>${escapeHtml(v.title)}</h3>
                <p>${escapeHtml(v.desc || "")}</p>
                <div>${tags}</div>
              </div>`;
          }).join("")
        : `<div class="empty">${q ? "Aramana uyan video bulunamadı." : "Henüz video eklenmedi."}</div>`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("year").textContent = new Date().getFullYear();

      const addBtn = document.getElementById("addBtn");
      const hint = document.getElementById("hint");

      if (Auth.isOwner) {
        addBtn.style.display = "flex";
        hint.textContent = "Owner olarak giriş yaptın. + ile yeni video ekleyebilirsin.";
      } else {
        hint.textContent = "Video eklemek için owner Gmail hesabıyla giriş yap.";
      }

      addBtn.onclick = () => {
        if (!Auth.isOwner) return;
        openModal("Video Ekle", [
          { name: "title", label: "Başlık", placeholder: "Video başlığı", required: true },
          { name: "url", label: "Video linki", placeholder: "https://www.youtube.com/watch?v=...", required: true },
          { name: "desc", label: "Açıklama", placeholder: "Kısa açıklama", type: "textarea" },
          { name: "tags", label: "Etiketler (virgülle)", placeholder: "trailer, oyun, duyuru" }
        ], data => {
          videos.push(data);
          DB.set("videos", videos);
          render(document.getElementById("search").value);
        });
      };

      document.getElementById("search").addEventListener("input", e => render(e.target.value));

      document.getElementById("grid").addEventListener("click", e => {
        const btn = e.target.closest(".del");
        if (!btn || !Auth.isOwner) return;
        if (confirm("Bu videoyu silmek istiyor musun?")) {
          videos.splice(Number(btn.dataset.i), 1);
          DB.set("videos", videos);
          render(document.getElementById("search").value);
        }
      });

      render();
    });
  </script>
</body>
</html>
