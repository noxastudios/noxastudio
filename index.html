<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Noxa Studio</title><link rel="stylesheet" href="style.css?v=3"></head>
<body data-page="index"><main id="top">
<section class="hero">
<span class="pill"><b></b><span data-i18n="pill"></span></span>
<h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em><br><span data-i18n="h1c"></span></h1>
<p class="sub" data-i18n="sub"></p>
<div class="cta"><a href="#board" class="btn btn-primary big" data-i18n="cta1"></a><a href="#videos" class="btn btn-ghost big" data-i18n="s_vid"></a></div>
</section>

<section class="section" id="categories"><h2 data-i18n="cat_t"></h2><p class="lead" data-i18n="cat_s"></p><div class="grid" id="catGrid"></div></section>

<section class="section" id="videos"><h2 data-i18n="vid_t"></h2><p class="lead" data-i18n="vid_s"></p>
<div id="admin-videos" class="admin"></div><div class="grid wide" id="items-videos"></div></section>

<section class="section" id="plugins"><h2 data-i18n="plug_t"></h2><p class="lead" data-i18n="plug_s"></p>
<div id="admin-plugins" class="admin"></div><div class="grid wide" id="items-plugins"></div></section>

<section class="section" id="board"><h2 data-i18n="board_t"></h2><br>
<div class="toolbar"><input id="search" type="search" data-i18n-ph="search"><select id="typeFilter"><option value="all" data-i18n="t_all"></option><option value="share" data-i18n="t_share"></option><option value="hire" data-i18n="t_hire"></option></select></div>
<div class="filters" id="filters"></div><div class="list" id="posts"></div></section>

<section class="section narrow" id="share"><h2 data-i18n="sh_t"></h2><p class="lead" data-i18n="sh_s"></p>
<form id="postForm" class="card form"><div class="row"><select id="pType"><option value="share" data-i18n="t_share"></option><option value="hire" data-i18n="t_hire"></option></select><select id="pCat"></select></div>
<input id="pTitle" required maxlength="80" data-i18n-ph="p_title"><textarea id="pDesc" required maxlength="500" rows="4" data-i18n-ph="p_desc"></textarea>
<input id="pLink" data-i18n-ph="p_link"><button class="btn btn-primary big" type="submit" data-i18n="p_send"></button></form></section>

<section class="section" id="community"><div class="discord card"><div><h2 data-i18n="dc_t"></h2><p class="lead" data-i18n="dc_s"></p></div>
<a class="btn btn-primary big" target="_blank" rel="noopener" href="https://discord.gg/QxwXSz8yK" data-i18n="dc_b"></a></div></section>
</main>
<script src="content.js?v=3"></script><script src="script.js?v=3"></script></body></html>
